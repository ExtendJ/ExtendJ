repositories {
  maven { url = uri("https://extendj.org/maven") }
}

configurations {
  codeprober
}

dependencies {
  codeprober 'org.codeprober:codeprober:1.+'
}

// The CodeProber jar file to launch can be overridden with a locally built one, e.g.:
//   ./gradlew :codeprober:java11 -PcodeproberJar=/path/to/codeprober/codeprober-X.Y.Z.jar
// When set, the release jar is not resolved or downloaded.

// The port CodeProber should listen on can be be overridden, e.g.:
//   ./gradlew :codeprober:java11 -PcodeproberPort=8001

// The codeproberJar and codeproberPort properties may also be set in
// gradle.properties or ~/.gradle/gradle.properties.

def codeproberClasspath = hasProperty('codeproberJar')
    ? files(codeproberJar)
    : configurations.codeprober

def codeproberPort = findProperty('codeproberPort')

defaultTasks 'java11'

task java11(type: JavaExec) {
  dependsOn project(':java11').tasks.named('jar')
  classpath = codeproberClasspath
  mainClass = 'codeprober.CodeProber'
  args project(':java11').file('extendj.jar'), '-XparseOnly'
  environment 'DISABLE_VERISON_CHECKER_BY_DEFAULT', 'true'
  if (codeproberPort != null) {
    environment 'PORT', codeproberPort
  }
}

task java8(type: JavaExec) {
  dependsOn project(':java8').tasks.named('jar')
  classpath = codeproberClasspath
  mainClass = 'codeprober.CodeProber'
  args project(':java8').file('extendj.jar'), '-XparseOnly'
  environment 'DISABLE_VERISON_CHECKER_BY_DEFAULT', 'true'
  if (codeproberPort != null) {
    environment 'PORT', codeproberPort
  }
}
