repositories {
  ivy {
    // Pretending that GitHub releases is an Ivy repository so that we can
    // depend on CodeProber jar published there.
    url = uri('https://github.com/lu-cs-sde/codeprober/releases/download')
    patternLayout { artifact '[revision]/[module].[ext]' }
    metadataSources { artifact() }
    content { includeGroup 'org.codeprober' }
  }
}

configurations {
  codeprober
}

dependencies {
  codeprober 'org.codeprober:codeprober:1.0.0@jar'
}

// The CodeProber jar to launch. Defaults to the resolved release above, but can
// be overridden with a locally built jar, e.g.:
//   ./gradlew :codeprober:java11 -PcodeproberJar=/path/to/codeprober/codeprober-X.Y.Z.jar
// The property may also be set in gradle.properties or ~/.gradle/gradle.properties.
// When set, the release jar is not resolved or downloaded.
def codeproberClasspath = hasProperty('codeproberJar')
    ? files(codeproberJar)
    : configurations.codeprober

// The web server port CodeProber should listen on. Defaults to 8000, but can
// be overridden, e.g.:
//   ./gradlew :codeprober:java11 -PcodeproberPort=8001
// The property may also be set in gradle.properties or ~/.gradle/gradle.properties.
// CodeProber also opens a separate WebSocket server, which is placed on the
// following port, so running parallel instances requires ports at least 2 apart.
def codeproberPort = findProperty('codeproberPort')
def codeproberWebSocketPort = codeproberPort == null ? null : (codeproberPort as int) + 1

defaultTasks 'java11'

task java11(type: JavaExec) {
  dependsOn project(':java11').tasks.named('jar')
  classpath = codeproberClasspath
  mainClass = 'codeprober.CodeProber'
  args project(':java11').file('extendj.jar'), '-XparseOnly'
  if (codeproberPort != null) {
    environment 'WEB_SERVER_PORT', codeproberPort
    environment 'WEBSOCKET_SERVER_PORT', codeproberWebSocketPort
  }
}

task java8(type: JavaExec) {
  dependsOn project(':java8').tasks.named('jar')
  classpath = codeproberClasspath
  mainClass = 'codeprober.CodeProber'
  args project(':java8').file('extendj.jar'), '-XparseOnly'
  if (codeproberPort != null) {
    environment 'WEB_SERVER_PORT', codeproberPort
    environment 'WEBSOCKET_SERVER_PORT', codeproberWebSocketPort
  }
}
